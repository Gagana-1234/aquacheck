<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AquaWatch — Anomaly Detection</title>
  <meta name="description" content="Flagged anomalies with severity scores, explanations, and resolution workflows."/>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">💧</div>
    <h1>Aqua<span>Watch</span></h1>
  </div>
  <div class="sidebar-section">Navigation</div>
  <a href="index.html" class="nav-item">📊 Dashboard</a>
  <a href="zones.html" class="nav-item">🗺️ Zone Monitor</a>
  <a href="anomalies.html" class="nav-item active">⚠️ Anomalies</a>
  <a href="redistribution.html" class="nav-item">🔄 Redistribution</a>
  <a href="reports.html" class="nav-item">📋 Reports</a>
  <a href="network.html" class="nav-item">🧠 Net Health</a>
  <a href="community.html" class="nav-item">🏆 Community</a>
  <div class="sidebar-status">
    <div class="status-dot"><div class="dot"></div> System Online</div>
    <div class="status-dot mt-4"><span style="font-size:10px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace" id="sidebar-time"></span></div>
  </div>
</nav>
<div class="main-content">
  <div class="top-bar">
    <div>
      <h2>Anomaly Detection</h2>
      <div style="font-size:12px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;margin-top:2px">Flagged readings requiring review</div>
    </div>
    <div class="top-bar-right">
      <div class="time-display" id="live-clock"></div>
      <button class="btn btn-ghost btn-sm" onclick="loadAnomalies()">↻ Refresh</button>
    </div>
  </div>
  <div class="page-body">
    <div class="filter-bar">
      <select class="filter-select" id="severity-filter">
        <option value="">All Severities</option>
        <option value="critical">Critical (Score ≥ 70)</option>
        <option value="warning">Warning (40–69)</option>
        <option value="info">Info (&lt; 40)</option>
      </select>
      <select class="filter-select" id="type-filter">
        <option value="">All Types</option>
        <option value="leak">Leak</option>
        <option value="overconsumption">Overconsumption</option>
        <option value="unusual_pattern">Unusual Pattern</option>
      </select>
      <span class="text-muted text-sm" id="anomaly-count"></span>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">⚠️ Flagged Anomalies</span>
      </div>
      <div class="card-body" id="anomalies-list">
        <div class="spinner"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/anomalies.js"></script>
</body>
</html>
